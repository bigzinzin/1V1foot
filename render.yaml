services:
  - type: web
    name: 1v1-foot-relay
    runtime: node
    region: frankfurt        # Europe : faible latence pour des joueurs FR/EU
    plan: free               # s'endort après 15 min d'inactivité (~30-60s de réveil)
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
